name: Windows installer qualification

# Owner-triggered only: push a throwaway `qualify/installer-*` branch, or dispatch
# manually once this file is on the default branch. It never runs for pull
# requests. It builds the NSIS installer natively on a disposable runner,
# installs it, and runs scripts/qualify-installed-windows.ps1. No security
# policy is changed; a blocked installer fails the job. The installer itself is
# not uploaded, only evidence.
on:
  push:
    branches:
      - "qualify/installer-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: Build, install and qualify (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record host security policy (read-only)
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\CI\Policy' -ErrorAction SilentlyContinue | Select-Object VerifiedAndReputablePolicyState | Format-List

      - name: Install dependencies
        run: npm ci

      - name: Build NSIS installer (documented packaging path)
        run: npm run package:windows

      - name: Qualify installed app
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'no NSIS installer was produced' }
          ./scripts/qualify-installed-windows.ps1 -Installer $installer.FullName -BuiltExecutable src-tauri/target/release/bob.exe -EvidenceDir installer-evidence

      - name: Upload evidence (no installer)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-qualification-evidence
          path: installer-evidence/
          retention-days: 14
          if-no-files-found: warn
