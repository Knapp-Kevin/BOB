name: PR Frontend diagnostic

on:
  pull_request:
    paths:
      - "src/**"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - ".github/workflows/pr-frontend-diagnostic.yml"

permissions:
  contents: read

jobs:
  frontend-diagnostic:
    name: Frontend build diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm install

      - name: TypeScript and Vite production build
        run: npm run build

      - name: Publish generated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
          if-no-files-found: error
