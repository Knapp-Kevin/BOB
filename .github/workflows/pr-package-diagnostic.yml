name: PR Windows package diagnostic

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - ".github/workflows/pr-package-diagnostic.yml"

permissions:
  contents: read

jobs:
  windows-package-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/materialize-lockfiles'
    name: Locked NSIS package diagnostic
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: Build locked targeted-clean NSIS package
        run: npm run package:windows

      - name: Publish NSIS candidate
        uses: actions/upload-artifact@v4
        with:
          name: bob-nsis-candidate
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
